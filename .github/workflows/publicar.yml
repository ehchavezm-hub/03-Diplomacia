name: Publicar Diplomacia Global en GitHub Pages

# Publica la carpeta public/ en https://ehchavezm-hub.github.io/03-Diplomacia/
on:
  push:
    branches:
      - main
  # Permite lanzar la publicación a mano desde la pestaña Actions.
  workflow_dispatch:
  # Cada 4 horas: actualiza las "Novedades de la última semana" y vuelve a publicar.
  schedule:
    - cron: "23 */4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Solo una publicación a la vez; si llega un cambio nuevo, se cancela la anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Comprobar que todo funciona (pruebas automáticas)
        run: npm test

      - name: Actualizar novedades de la última semana
        # Si alguna fuente de noticias falla, se omite; nunca detiene la publicación.
        continue-on-error: true
        timeout-minutes: 5
        run: npm run actualizar

      # TEMPORAL: comprueba servicios de búsqueda (CORS) y direcciones RSS alternativas.
      - name: Diagnóstico de servicios de búsqueda
        continue-on-error: true
        run: |
          set +e
          probar() {
            echo "=== $1"
            curl -s -m "$2" -A "Mozilla/5.0" -D /tmp/cab -o /tmp/cuerpo -w "codigo=%{http_code} tiempo=%{time_total}s\n" -H "Origin: https://ehchavezm-hub.github.io" "$1"
            grep -i -E "access-control-allow-origin|content-type" /tmp/cab
            head -c 300 /tmp/cuerpo | tr '\n' ' '; echo
          }
          probar "https://api.gdeltproject.org/api/v2/doc/doc?query=fujimori%20domainis:elcomercio.pe&mode=ArtList&format=json&maxrecords=3&sort=DateDesc" 60
          probar "https://www.googleapis.com/books/v1/volumes?q=subject:diplomacy&orderBy=newest&maxResults=2" 20
          probar "https://openlibrary.org/search.json?q=diplomacy&limit=1&fields=title" 20
          probar "https://api.crossref.org/works?rows=1&query=peru" 20
          for u in \
            https://larepublica.pe/rss/politica.xml https://larepublica.pe/arc/outboundfeeds/rss/category/politica/ https://larepublica.pe/arcio/rss/ https://larepublica.pe/rss/ \
            https://peru21.pe/arcio/rss/ https://peru21.pe/arc/outboundfeeds/rss/category/politica/ https://peru21.pe/feed/ https://peru21.pe/rss/politica.xml \
            https://rpp.pe/feed https://rpp.pe/rss https://rpp.pe/rss/politica.xml https://rpp.pe/feed/politica; do
            probar "$u" 20
          done

      - name: Preparar la web para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
